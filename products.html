<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Sản Phẩm | G-Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header {
            padding: 40px 0 20px;
            text-align: center;
        }

        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> G-MARKET</a>
            <nav class="nav-menu">
                <a href="index.html">Trang chủ</a>
                <a href="products.html" class="active">Sản phẩm</a>
            </nav>
            <div class="user-actions">
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- PRODUCTS PAGE CONTENT -->
    <div class="container">
        <div class="page-header">
            <h1>Danh Sách Sản Phẩm & Thiết Bị</h1>
            <p style="color: var(--text-muted);">Khám phá kho tàng vật phẩm và phụ kiện chơi game chính hãng</p>
        </div>

        <!-- Bộ lọc danh mục -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCategory('All')">Tất cả</button>
            <button class="filter-btn" onclick="filterCategory('Thẻ Game')">Thẻ Game</button>
            <button class="filter-btn" onclick="filterCategory('Gaming Gear')">Gaming Gear</button>
            <button class="filter-btn" onclick="filterCategory('Vật Phẩm')">Vật Phẩm</button>
        </div>

        <!-- Lưới sản phẩm -->
        <div class="product-grid" id="fullProductGrid" style="margin-bottom: 60px;">
            <!-- Dữ liệu render bằng JavaScript -->
        </div>
    </div>

    <script>
        const allProducts = [
            { id: 1, name: "Thẻ Steam Wallet 100$ USD", price: 2450000, image: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=500&q=80", category: "Thẻ Game" },
            { id: 2, name: "Chuột Gaming Razer Viper V2 Pro", price: 3290000, image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500&q=80", category: "Gaming Gear" },
            { id: 3, name: "Tai Nghe Logitech G Pro X Wireless", price: 4150000, image: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500&q=80", category: "Gaming Gear" },
            { id: 4, name: "Skin Valorant Elderflame Vandal", price: 850000, image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&q=80", category: "Vật Phẩm" },
            { id: 5, name: "Bàn Phím Cơ Asus ROG Strix Scope", price: 2890000, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&q=80", category: "Gaming Gear" },
            { id: 6, name: "Thẻ Garena 500.000 VNĐ", price: 475000, image: "https://images.unsplash.com/photo-1534423861386-85a16f5d13fd?w=500&q=80", category: "Thẻ Game" }
        ];

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function renderProductsGrid(productsToRender) {
            const grid = document.getElementById('fullProductGrid');
            grid.innerHTML = productsToRender.map(product => `
        <div class="product-card">
          <a href="detail.html?id=${product.id}">
            <img src="${product.image}" alt="${product.name}" class="product-img">
          </a>
          <div class="product-info">
            <h3 class="product-title">
              <a href="detail.html?id=${product.id}">${product.name}</a>
            </h3>
            <p class="product-price">${formatCurrency(product.price)}</p>
            <a href="detail.html?id=${product.id}" class="btn btn-outline" style="text-align: center; margin-bottom: 8px;">Xem chi tiết</a>
            <button class="btn btn-primary" onclick="addToCart(${product.id})">
              <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ
            </button>
          </div>
        </div>
      `).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'All') {
                renderProductsGrid(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === cat);
                renderProductsGrid(filtered);
            }
        }

        function addToCart(productId) {
            let cart = JSON.parse(localStorage.getItem('gmarket_cart')) || [];
            cart.push(productId);
            localStorage.setItem('gmarket_cart', JSON.stringify(cart));
            updateCartCount();
            alert("Đã thêm sản phẩm vào giỏ hàng!");
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('gmarket_cart')) || [];
            const cartCountEl = document.getElementById('cartCount');
            if (cartCountEl) cartCountEl.textContent = cart.length;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProductsGrid(allProducts);
            updateCartCount();
        });
    </script>
</body>

</html>
