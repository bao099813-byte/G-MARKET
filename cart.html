<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng | G-Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> G-MARKET</a>
      <nav class="nav-menu">
        <a href="index.html">Trang chủ</a>
        <a href="products.html">Sản phẩm</a>
      </nav>
      <div class="user-actions">
        <a href="cart.html" class="cart-btn" style="color: var(--primary);">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- NỘI DUNG GIỎ HÀNG -->
  <div class="container" style="padding: 40px 0;">
    <h1 style="font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 30px;">Giỏ Hàng Của Bạn</h1>
    <div id="cartContainer">
      <!-- Dữ liệu giỏ hàng sẽ được JavaScript tự động điền vào đây -->
    </div>
  </div>

  <!-- JAVASCRIPT XỬ LÝ GIỎ HÀNG -->
  <script>
    // Danh sách sản phẩm gốc (Đảm bảo ID khớp hoàn toàn với các trang khác)
    const productsData = [
      { id: 1, name: "Thẻ Steam Wallet 100$ USD", price: 2450000, image: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=500&q=80" },
      { id: 2, name: "Chuột Gaming Razer Viper V2 Pro", price: 3290000, image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500&q=80" },
      { id: 3, name: "Tai Nghe Logitech G Pro X Wireless", price: 4150000, image: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500&q=80" },
      { id: 4, name: "Skin Valorant Elderflame Vandal", price: 850000, image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&q=80" },
      { id: 5, name: "Bàn Phím Cơ Asus ROG Strix Scope", price: 2890000, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&q=80" },
      { id: 6, name: "Thẻ Garena 500.000 VNĐ", price: 475000, image: "https://images.unsplash.com/photo-1534423861386-85a16f5d13fd?w=500&q=80" }
    ];

    // Hàm định dạng tiền VNĐ
    fnFormatMoney = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);

    // Hàm load và hiển thị giỏ hàng
    function displayCart() {
      const container = document.getElementById('cartContainer');
      const badgeCount = document.getElementById('cartCount');
      
      // Lấy danh sách ID từ localStorage (nếu chưa có thì là mảng trống [])
      let cartIds = JSON.parse(localStorage.getItem('gmarket_cart')) || [];
      
      // Cập nhật số lượng trên icon giỏ hàng ở header
      if (badgeCount) badgeCount.textContent = cartIds.length;

      // Nếu giỏ hàng trống
      if (cartIds.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 0; color: #94a3b8;">
            <i class="fa-solid fa-cart-arrow-down" style="font-size: 4rem; margin-bottom: 15px; color: #2a2d3d;"></i>
            <h2>Giỏ hàng của bạn đang trống</h2>
            <p style="margin: 10px 0 20px;">Hãy quay lại cửa hàng để chọn thêm sản phẩm nhé!</p>
            <a href="products.html" class="btn btn-primary" style="background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; padding: 10px 24px; border-radius: 6px; font-weight: bold; text-decoration: none; display: inline-block;">Xem sản phẩm ngay</a>
          </div>
        `;
        return;
      }

      // Đếm số lượng trùng lặp của mỗi sản phẩm
      let countMap = {};
      cartIds.forEach(id => {
        countMap[id] = (countMap[id] || 0) + 1;
      });

      let htmlList = '';
      let totalAmount = 0;

      // Duyệt qua các sản phẩm có trong giỏ
      for (let idStr in countMap) {
        let prodId = parseInt(idStr);
        let qty = countMap[idStr];
        let matchedProduct = productsData.find(p => p.id === prodId);

        if (matchedProduct) {
          let subTotal = matchedProduct.price * qty;
          totalAmount += subTotal;

          htmlList += `
            <div style="background: #181a24; border: 1px solid #2a2d3d; border-radius: 10px; padding: 15px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
              <img src="${matchedProduct.image}" alt="${matchedProduct.name}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
              <div style="flex-grow: 1;">
                <h3 style="font-size: 1.1rem; margin-bottom: 5px; color: #f1f5f9;">${matchedProduct.name}</h3>
                <div style="color: #00f2fe; font-weight: bold; margin-bottom: 8px;">${fnFormatMoney(matchedProduct.price)}</div>
                <div style="display: flex; align-items: center; gap: 20px; color: #94a3b8; font-size: 0.95rem;">
                  <span>Số lượng: <strong style="color: #fff;">${qty}</strong></span>
                  <button onclick="removeItem(${matchedProduct.id})" style="background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-weight: 500;">
                    <i class="fa-solid fa-trash"></i> Xóa bỏ
                  </button>
                </div>
              </div>
              <div style="text-align: right; font-weight: bold; color: #fff;">
                Thành tiền: <span style="color: #00f2fe;">${fnFormatMoney(subTotal)}</span>
              </div>
            </div>
          `;
        }
      }

      // Hiển thị khung bố cục danh sách sản phẩm & tổng tiền thanh toán
      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;" class="cart-grid-box">
          <div>${htmlList}</div>
          <div style="background: #181a24; border: 1px solid #2a2d3d; border-radius: 10px; padding: 25px; height: fit-content;">
            <h3 style="font-family: 'Orbitron', sans-serif; margin-bottom: 15px; border-bottom: 1px solid #2a2d3d; padding-bottom: 10px; color: #f1f5f9;">Tổng Thanh Toán</h3>
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem;">
              <span style="color: #94a3b8;">Tổng tiền hàng:</span>
              <span style="color: #00f2fe; font-weight: bold;">${fnFormatMoney(totalAmount)}</span>
            </div>
            <button onclick="checkoutCart()" style="width: 100%; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;">
              Tiến Hành Thanh Toán
            </button>
          </div>
        </div>
      `;
    }

    // Hàm xóa sản phẩm khỏi giỏ hàng
    function removeItem(id) {
      let cartIds = JSON.parse(localStorage.getItem('gmarket_cart')) || [];
      // Lọc bỏ tất cả các phần tử có ID trùng khớp
      cartIds = cartIds.filter(item => item !== id);
      localStorage.setItem('gmarket_cart', JSON.stringify(cartIds));
      displayCart(); // Load lại giao diện giỏ hàng ngay lập tức
    }

    // Hàm thanh toán giả lập
    function checkoutCart() {
      alert("🎉 Đặt hàng thành công! Cảm ơn bạn đã mua sắm tại G-Market.");
      localStorage.removeItem('gmarket_cart'); // Xóa sạch giỏ hàng sau khi mua
      displayCart();
    }

    // Chạy hàm hiển thị ngay khi trang vừa load xong
    document.addEventListener('DOMContentLoaded', displayCart);
  </script>

</body>
</html>
